  <style type="text/css">
    
    body{
      font-family: monospace;
      background-image: url('stream_assets/stream3.gif');
      background-size: cover; /* Cover the entire background */
      background-repeat: no-repeat; /* Prevent the image from repeating */
      background-attachment: fixed; /* Fixed background position */
      max-width: 90%;
      text-align: left;
      margin: 0 auto;
      overflow: hidden;
    }
    
    
    header{
      text-align: center;
      margin: 1em;
      color: lavender;
    }

    #columns {
    display: flex;
    }

    #left-column {
     width: 65%;
     height: 100vh;
     overflow-y: auto;
    }

    #right-column {
        width: 35%;
        height: 100vh;
        overflow: hidden;
    }
    

    img{
      display: inline-block;
      width: 190px; 
      padding: 0rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    h1{
      font-size:30px;
      font-family: monospace;
    }
    h3{
      font-size:18px;
      color:red;

    }
    
    h2{
      font-size:20px;
      font-style: italic;
      color:blue;

    }
    
    h4{
      font-size:15px;
      color: lavender;
    }
    
    h5{
      font-size:14px;
      line-height: normal;
      color: lavender;
      background-size: 105%;
      line-height: 0.5
    }
    
    p{
      font-size:13.5px;
      line-height: normal;
      color:lavender;
    }

    pre{
      color:lavender;
    }
    
    a {
    color: lavender; /* Link color for unvisited links */
    }

    a:visited {
    color: lavender; /* Link color for visited links */
    }
    
    /* code.js */

    #content {
    margin: 20px;
    padding: 20px;
    }

    .item {
    display: block;
    padding: 10px;
    border-style: dotted;
    border-color: lavender;
    border-radius: 15px;
    margin-bottom: 20px;
    }

    
    /* codeusingtable.js */
    table{
      margin: 0 auto;
    }
    
    td{
      padding: 0px;
    }
 
    
  </style>
</head>

  <header>
    <h1>live stream</h1>
      <p>
        <a href="/" target="_self"> go back to talyssa.com</a>
